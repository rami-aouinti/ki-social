services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    command: sh -lc "touch database/database.sqlite && composer install --no-interaction && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
volumes:
  vendor: